# Netlify configuration for Maha Services Flutter Web App
[build]
  command = "# no build command — pre-built artifacts deployed"
  functions = "netlify/functions"
  publish = "build/web"

# ── SPA Routing ──
# All deep-links must resolve to index.html so GoRouter handles them client-side
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Performance Headers ──
# Aggressive caching for hashed/immutable static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/wasm"

# Image assets — cache for 1 day with stale-while-revalidate
[[headers]]
  for = "/*.@(png|jpg|jpeg|gif|svg|webp|ico)"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

# ── COOP / COEP for Flutter WASM + SharedArrayBuffer ──
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
