<!DOCTYPE html>
<html lang="en">
<head>
    <!-- base href will be replaced by flutter build when using --base-href -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=0.95" />
    <meta name="description" content="Maha Services — Smart End-To-End Hiring Platform. Connect job seekers with recruiters using AI-powered matching.">
    <meta name="theme-color" content="#6366F1">

    <!-- DNS pre-connect for faster Firebase & Google Fonts loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firebaseinstallations.googleapis.com" crossorigin>

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Maha Services" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo.png" />

    <title>Maha Services — Hiring Management System</title>
    <link rel="manifest" href="manifest.json" />

    <!-- Inline critical CSS for the loading splash — zero network dependency -->
    <style>
      body { margin: 0; background: #0f0f23; overflow: hidden; }
      .loading-overlay {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
        transition: opacity 0.4s ease-out;
      }
      .loading-overlay.fade-out { opacity: 0; pointer-events: none; }
      .loading-logo {
        width: 80px; height: 80px; margin-bottom: 24px;
        animation: pulse 1.8s ease-in-out infinite;
      }
      .loading-bar-track {
        width: 200px; height: 3px; border-radius: 4px;
        background: rgba(255,255,255,0.1); overflow: hidden;
      }
      .loading-bar-fill {
        width: 40%; height: 100%; border-radius: 4px;
        background: linear-gradient(90deg, #6366F1, #818CF8);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
</head>

<body>
<!-- Branded loading splash — visible while Flutter boots -->
<div id="loading" class="loading-overlay" aria-label="Loading Maha Services">
  <img class="loading-logo" src="web/icons/icon-512.png" alt="Maha Services" width="300" height="300">
  <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
</div>

<script>
    // Dismiss loading splash once Flutter renders
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 400);
      }
    });
    // Keep console errors visible for diagnosis during dev.
    window.addEventListener('error', function (e) {
      console.error('Runtime error:', e);
    });
</script>
<script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>
<!-- Flutter bootstrap (generated by the build). Keep async for faster startup. -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
