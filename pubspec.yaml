name: job_portal
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  lottie: ^3.3.1
  intl: ^0.20.2
  provider: ^6.0.5
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.2
  http: ^1.2.2
  firebase_storage: ^13.0.2
  firebase_auth: ^6.1.0
  google_fonts: any
  web: ^1.1.1
  flutter_svg: ^2.0.17
  go_router: ^17.1.0
  pdf: ^3.10.4
  timeago: ^3.3.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.0.0
  flutter_date_pickers: ^0.4.3
  url_launcher: ^6.3.2
  read_pdf_text: ^0.3.1
  markdown_widget: ^2.3.2+8
  printing: ^5.14.2
  image_picker_for_web: ^3.1.0
  image_picker: ^1.2.0
  flutter_dotenv: ^6.0.0
  file_picker: ^11.0.2
  mime: ^2.0.0
  tuple: any
  path_provider: any
  flutter_quill: ^11.5.1
  flutter_localizations:
    sdk: flutter



  archive: any
  xml: any
  rxdart: any
  http_parser: any
# Temporary: lottie <= 3.5.1 crashes Flutter web (CanvasKit) with "Stack Overflow"
# when an animation uses animated Trim Paths (images/1.json on the landing page).
# It calls `path.set(pathMetric.extractPath(...))`, and on web the extracted path
# lazily references the path it was just assigned back into, so LazyPath.builtPath
# recurses forever. third_party/lottie is lottie 3.3.3 with the upstream fix
# (xvrh/lottie-flutter#428) applied; see third_party/lottie/PATCH.md.
# Delete third_party/lottie and this override once lottie >= 3.5.2 is on pub.dev.
dependency_overrides:
  lottie:
    path: third_party/lottie

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Every file under images/ is bundled by the directory entry below, so each
  # asset needs listing only once. Keep this list to what the code loads —
  # anything else ships dead weight to every user.
  assets:
    - images/          # logo_new.jpeg, applied.svg, ai.json, 1-4.json,
                       # MaterialIcons-Regular.ttf
